<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUFS Status Scan — {{ meta.title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f9; min-height: 100vh; padding: 30px 16px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); padding: 32px; width: 100%; max-width: 880px; margin: 0 auto; }
    a.back { color: #3182ce; font-size: .85rem; text-decoration: none; }
    h1 { font-size: 1.4rem; color: #1a202c; margin: 8px 0 4px; }
    p.sub { color: #718096; font-size: .9rem; margin-bottom: 20px; }
    .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: .9rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #3182ce; color: #fff; }
    .btn-primary:hover { background: #2b6cb0; }
    .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
    .btn-green { background: #38a169; color: #fff; }
    .btn-green:hover { background: #2f855a; }
    .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    label.chk { font-size: .85rem; color: #4a5568; display: flex; align-items: center; gap: 6px; }
    #status { font-size: .85rem; margin: 10px 0; min-height: 1.2em; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: .82rem; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #edf2f7; }
    th { color: #718096; font-weight: 600; background: #f7fafc; }
    td.partial { color: #b7791f; }
    .empty { color: #a0aec0; }
    .summary { font-size: .82rem; color: #718096; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <a class="back" href="/">← Back</a>
    <h1>SUFS Status Scan</h1>
    <p class="sub">{{ meta.title }} — scans your Gmail for approval / on-hold / payment emails and proposes date updates. Nothing is written until you click <strong>Write</strong>.</p>

    <div class="row">
      <button class="btn btn-primary" id="scan-btn" onclick="runScan()">Scan emails</button>
      <label class="chk"><input type="checkbox" id="overwrite" /> Overwrite values that already exist</label>
    </div>

    <div id="status"></div>
    <div id="summary" class="summary"></div>
    <div id="results"></div>

    <div class="row" id="apply-row" style="display:none;margin-top:18px;">
      <button class="btn btn-green" id="apply-btn" onclick="applyUpdates()">Write <span id="apply-count">0</span> update(s) to the sheet</button>
    </div>
  </div>

  <script>
    const TAB = {{ tab|tojson }};
    let pending = [];

    const statusEl = document.getElementById('status');
    const summaryEl = document.getElementById('summary');
    const resultsEl = document.getElementById('results');
    const applyRow = document.getElementById('apply-row');
    const applyCount = document.getElementById('apply-count');
    const scanBtn = document.getElementById('scan-btn');
    const applyBtn = document.getElementById('apply-btn');

    function esc(s) { return (s ?? '').toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function cell(val, partial) {
      if (!val) return '<td class="empty">—</td>';
      return `<td${partial ? ' class="partial"' : ''}>${esc(val)}${partial ? ' (partial)' : ''}</td>`;
    }

    function renderTable(updates) {
      if (!updates.length) { resultsEl.innerHTML = ''; return; }
      let head, body;
      if (TAB === 'main') {
        head = '<tr><th>Row</th><th>Reimb ID</th><th>Store</th><th>Item</th><th>Approve Date</th><th>Paid Date</th></tr>';
        body = updates.map(u => `<tr>
          <td>${u.row_index}</td><td>${esc(u.id)}</td><td>${esc(u.store)}</td><td>${esc(u.item)}</td>
          ${cell(u.approved_date, u.approved_partial)}${cell(u.paid_date, u.paid_partial)}</tr>`).join('');
      } else {
        head = '<tr><th>Row</th><th>Reimb ID</th><th>Item</th><th>Status</th><th>On Hold</th><th>Approved</th><th>Paid</th></tr>';
        body = updates.map(u => `<tr>
          <td>${u.row_index}</td><td>${esc(u.id)}</td><td>${esc(u.item)}</td>
          ${cell(u.status)}${cell(u.on_hold_date)}${cell(u.approved_date)}${cell(u.paid_date)}</tr>`).join('');
      }
      resultsEl.innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
    }

    async function runScan() {
      scanBtn.disabled = true; scanBtn.textContent = 'Scanning…';
      statusEl.style.color = '#4a5568'; statusEl.textContent = 'Reading the sheet and scanning Gmail… (this can take 30–60s)';
      summaryEl.textContent = ''; resultsEl.innerHTML = ''; applyRow.style.display = 'none'; pending = [];
      try {
        const res = await fetch(`/sufs-scan/${TAB}/preview`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ overwrite: document.getElementById('overwrite').checked })
        });
        const d = await res.json();
        if (d.error) { statusEl.style.color = '#c53030'; statusEl.textContent = 'Error: ' + d.error; return; }
        pending = d.updates || [];
        const s = d.scanned || {};
        summaryEl.textContent = 'Emails found — ' + Object.entries(s).map(([k, v]) => `${k}: ${v}`).join(', ');
        if (!pending.length) {
          statusEl.style.color = '#276749';
          statusEl.textContent = 'No new updates to write (everything matched is already filled in). Check “Overwrite” to force.';
        } else {
          statusEl.style.color = '#276749';
          statusEl.textContent = `${pending.length} row(s) ready to update. Review below, then write.`;
          renderTable(pending);
          applyCount.textContent = pending.length;
          applyRow.style.display = 'flex';
        }
      } catch (e) {
        statusEl.style.color = '#c53030'; statusEl.textContent = 'Network error: ' + e.message;
      } finally {
        scanBtn.disabled = false; scanBtn.textContent = 'Scan emails';
      }
    }

    async function applyUpdates() {
      if (!pending.length) return;
      applyBtn.disabled = true; applyBtn.textContent = 'Writing…';
      try {
        const res = await fetch(`/sufs-scan/${TAB}/apply`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ updates: pending })
        });
        const d = await res.json();
        if (d.success) {
          statusEl.style.color = '#276749';
          statusEl.textContent = `✓ Wrote ${d.written} update(s) to the sheet.`;
          resultsEl.innerHTML = ''; applyRow.style.display = 'none'; pending = [];
        } else {
          statusEl.style.color = '#c53030'; statusEl.textContent = 'Error: ' + (d.error || 'write failed');
          applyBtn.disabled = false; applyBtn.textContent = 'Write update(s) to the sheet';
        }
      } catch (e) {
        statusEl.style.color = '#c53030'; statusEl.textContent = 'Network error: ' + e.message;
        applyBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
